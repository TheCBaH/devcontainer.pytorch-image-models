name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  uv:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          # check-history walks the first-parent tag history, which a shallow checkout
          # cannot provide -- it fails loudly rather than silently skipping the check.
          fetch-depth: 0

      - name: setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: true

      - name: test
        run: make test

      - name: report
        run: make report.ci

      - name: select
        run: make models.select

      # Restore-only, same cache release.yml restores from: `models` (cmd_build) traces
      # PRETRAINED_SENSITIVE_MODELS with real weights, so it needs *some* HF cache to stay
      # off the network per iso_env's HF_HUB_OFFLINE=1. A miss just means the fetch step
      # below does a small real download instead of finding it already there.
      - name: huggingface cache
        uses: ./.github/workflows/actions/hf-cache

      - name: fetch pretrained-sensitive checkpoints
        run: make models.fetch-sensitive

      - name: models
        run: make models

      - name: verify graphs against ops-aten.yaml
        run: make models.verify

      - name: check release-tier removals are recorded
        run: make check-history

      - name: static graph facts (op_facts.json)
        run: make models.compat-static

      - name: check tree is unmodified
        run: make check-tree-clean

  devcontainer:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: devcontainer
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: devcontainer
        with:
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup
        run: echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV

      - name: test
        run: ${{ env.EXEC }} make test

      - name: report
        run: ${{ env.EXEC }} make report.ci

      - name: select
        run: ${{ env.EXEC }} make models.select

      # Restore-only, same cache release.yml restores from: `models` (cmd_build) traces
      # PRETRAINED_SENSITIVE_MODELS with real weights, so it needs *some* HF cache to stay
      # off the network per iso_env's HF_HUB_OFFLINE=1. A miss just means the fetch step
      # below does a small real download instead of finding it already there. Runs on the
      # host, ahead of devcontainer exec, into the bind-mounted workspace's .hf-cache -- the
      # same relative path cmd_build's own --hf-home default resolves to inside the container.
      - name: huggingface cache
        uses: ./.github/workflows/actions/hf-cache

      - name: fetch pretrained-sensitive checkpoints
        run: ${{ env.EXEC }} make models.fetch-sensitive

      - name: models
        run: ${{ env.EXEC }} make models

      - name: verify graphs against ops-aten.yaml
        run: ${{ env.EXEC }} make models.verify

      - name: check release-tier removals are recorded
        run: ${{ env.EXEC }} make check-history

      - name: static graph facts (op_facts.json)
        run: ${{ env.EXEC }} make models.compat-static

      # Runs in the devcontainer only, where paths differ from the uv job's: if a graph ever
      # picked up machine-specific state again, this is where it shows up, and readably. Also
      # covers op_facts.json: check_models.sh diffs every changed/untracked file under
      # models/, not just model.json specifically.
      - name: check models
        run: ${{ env.EXEC }} make check-models

      - name: check tree is unmodified
        run: ${{ env.EXEC }} make check-tree-clean
