name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  uv:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: setup uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: report
        run: make report.ci

      - name: select
        run: make models.select

      - name: models
        run: make models

      - name: verify graphs against ops-aten.yaml
        run: make models.verify

      - name: check tree is unmodified
        run: make check-tree-clean

  devcontainer:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: devcontainer
        uses: ./.github/workflows/actions/devcontainer
        id: devcontainer
        with:
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup
        run: echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV

      - name: report
        run: ${{ env.EXEC }} make report.ci

      - name: select
        run: ${{ env.EXEC }} make models.select

      - name: models
        run: ${{ env.EXEC }} make models

      - name: verify graphs against ops-aten.yaml
        run: ${{ env.EXEC }} make models.verify

      # Runs in the devcontainer only, where paths differ from the uv job's: if a graph ever
      # picked up machine-specific state again, this is where it shows up, and readably.
      - name: check models
        run: ${{ env.EXEC }} make check-models

      - name: check tree is unmodified
        run: ${{ env.EXEC }} make check-tree-clean
