[project]
name = "pt2-export-core"
version = "0.1.0"
description = "Domain-agnostic core for exporting model zoos to torch.export/PT2: subprocess isolation, ATen op cross-reference, coverage-based model selection, HF Hub popularity, and .pt2 archive utilities."
requires-python = ">=3.10"
dependencies = [
        'huggingface-hub',
        'jsonschema',
        'pyyaml',
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pt2_export_core"]
