# Models published as fp16 cast/autocast PT2 graphs (models-fp16/cast/, models-fp16/autocast/).
#
# Generated by scripts/select_models_precision.py from the operator cross-references + models.md +
# model-popularity.yaml -- regenerate with `make models.select.fp16`. Hand edits are overwritten,
# except `include` and `exclude`, which are read back and honoured verbatim.
#
# phase     why the model is here: `ops` = it carried (operator, configuration) units nothing
#           else cheaper did, `family` = its architecture family had no representative,
#           `include` = named by hand. Coverage spans every catalogued dialect, so a unit can
#           be one an ATen graph shows (conv2d), one only its functionalized form shows
#           (relu for relu_), or one only its decomposition shows (addmm).
# nodes     ATen nodes in its exported graph; the cost driver for the committed JSON.
# downloads HuggingFace Hub downloads (last 30 days, summed across pretrained tags); decides
#           which model fills a coverage slot when several could, not which slot goes next.
#           Absent if the model has no Hub weights or fetch_popularity.py has not seen it.
# release   inherited from select_models.py's shared renderer: has fetchable pretrained
#           weights within the weight cap and a classification head. This manifest has
#           no release archive of its own (see models-selected.yaml for that) -- the
#           flag only says a real checkpoint could back this model's graph.

