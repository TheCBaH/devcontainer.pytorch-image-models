# Ledger of release-tier model IDs that were removed and have not returned as of the most
# recent release tag. Checked by `scripts/models_history.py check` (`make check-history`):
# a release-tier model present at the previous release tag but absent at the current commit
# must have an entry here, or the check fails.
#
# Scope: release-tier removals only, checked against the *immediately preceding* release tag
# only -- not the full selected pool, and not full history. The selected pool (~100 models)
# reshuffles a meaningful fraction release over release as part of its coverage-optimization
# search, and a model that disappears and later returns (confirmed real behavior between
# v0.0.1 and v0.0.3: starnet_s050, test_convnext2) was never actually retired -- it needs no
# entry, and any entry here for a name that is back in the current release tier is ignored by
# manifest.json's `retired` section (see pt2_export_core.manifest.diff_retirements).
#
# Entry shape:
#   <name>:
#     removed_in: <tag it first became release-tier or fully absent as of, e.g. v0.0.4>
#     reason: <free text -- weight cap, superseded by another id, dropped from the zoo, ...>
#     migrate_to: <a current model id, or null if there is no direct replacement>
models:
  vit_small_patch16_dinov3_qkvb:
    removed_in: v0.0.4
    reason: >-
      Selection's release eligibility now requires a classification head (num_classes > 0).
      This is timm's DINOv3 self-supervised backbone (lvd1689m tag): num_classes=0 by design,
      so it has no logits for the release archive's expected-top5 contract to report --
      export_pt2 was producing a contract.json with classes.count=0, which fails
      contract.schema.json's minimum-1 constraint.
    migrate_to: null

  maxxvitv2_nano_rw_256:
    removed_in: v0.0.4
    reason: >-
      Coverage-optimization reshuffle after bumping modules/pytorch-image-models to e617d17:
      the new families it adds (e.g. beit3_*, aimv2_*) claim (operator, configuration) units
      more cheaply, pushing this out of the top 100. The maxxvit family has no other release
      candidate this round; the model itself is untouched upstream and can return if coverage
      shifts again.
    migrate_to: null

  mobilenet_edgetpu_v2_m:
    removed_in: v0.0.4
    reason: >-
      Same coverage-optimization reshuffle as maxxvitv2_nano_rw_256. The mobilenet_edgetpu_v2
      family has no other release candidate this round.
    migrate_to: null

  mobilenetv3_large_150d:
    removed_in: v0.0.4
    reason: >-
      Same coverage-optimization reshuffle as maxxvitv2_nano_rw_256.
    migrate_to: mobilenetv3_small_050

  mobileone_s2:
    removed_in: v0.0.4
    reason: >-
      Same coverage-optimization reshuffle as maxxvitv2_nano_rw_256.
    migrate_to: mobileone_s3

  repghostnet_130:
    removed_in: v0.0.4
    reason: >-
      Same coverage-optimization reshuffle as maxxvitv2_nano_rw_256.
    migrate_to: repghostnet_111

  tf_mobilenetv3_small_100:
    removed_in: v0.0.4
    reason: >-
      Same coverage-optimization reshuffle as maxxvitv2_nano_rw_256.
    migrate_to: tf_mobilenetv3_small_minimal_100

